apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-api
  namespace: taskflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [taskflow.example.com]
      secretName: taskflow-tls          # issued by cert-manager
  rules:
    - host: taskflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-api
                port:
                  number: 80

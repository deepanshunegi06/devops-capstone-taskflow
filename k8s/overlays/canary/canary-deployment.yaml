apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api-canary
  namespace: taskflow
  labels:
    app: taskflow-api
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-api
      track: canary
  template:
    metadata:
      labels:
        app: taskflow-api
        track: canary
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: taskflow-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/deepanshunegi06/devops-capstone-taskflow/taskflow-api:latest   # canary image digest set by CI
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: canary
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

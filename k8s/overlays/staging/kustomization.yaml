# Staging: single stable replica set, lower resources, staging host.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskflow
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: taskflow-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Ingress
      name: taskflow-api
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: taskflow-staging.example.com

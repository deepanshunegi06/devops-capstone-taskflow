server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs: keep only the taskflow-api container, parse the JSON log line.
  - job_name: taskflow-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: app
        action: keep
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
        regex: app
        replacement: taskflow-api
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            status: status
      - labels:
          level:
          status:

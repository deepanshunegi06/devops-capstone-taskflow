global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: taskflow-api
    metrics_path: /metrics
    # Docker Compose target. In Kubernetes, use kubernetes_sd_configs with the
    # prometheus.io/scrape annotations present in k8s/base/deployment.yaml.
    static_configs:
      - targets: ["app:8080"]
        labels:
          service: taskflow-api
          env: local
